<!DOCTYPE html>

<html lang="pt-BR">

<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Contato - Adote um Amigo</title>

<link rel="stylesheet" href="style.css">

</head>

<body>

<header>

    <nav>
        <a href="index.html">Início</a>
        <a href="animais.html">Animais</a>
        <a href="sobre.html">Sobre nós</a>
        <a href="contato.html">Informações de contato</a>
    </nav>

</header>

<main>

    <h1>Entre em contato 📩</h1>

    <section class="contato">

        <h2>Fale com a gente</h2>

        <div class="dados-contato">

            <p><strong>📧 E-mail:</strong> contato@adoteumamigo.com</p>

            <p><strong>📱 Telefone:</strong> (19) 99999-9999</p>

            <p><strong>📍 Localização:</strong> Araras - SP</p>

        </div>

        <h2>Quer adotar um amigo?</h2>

        <p>
            Preencha o formulário abaixo e entre em contato
            conosco para saber mais sobre a adoção.
        </p>

        <form>

            <label for="nome">Nome:</label>
            <input type="text" id="nome" name="nome" placeholder="Digite seu nome">

            <label for="email">E-mail:</label>
            <input type="email" id="email" name="email" placeholder="Digite seu e-mail">

            <label for="animal">Animal de interesse:</label>

            <select id="animal" name="animal">

                <option value="">Selecione um animal</option>
                <option value="mel">Mel</option>
                <option value="thor">Thor</option>
                <option value="luna">Luna</option>
                <option value="bento">Bento</option>
                <option value="celine">Celine</option>
                <option value="mia">Mia</option>
                <option value="nino">Nino</option>
                <option value="amora">Amora</option>

            </select>

            <label for="mensagem">Mensagem:</label>

            <textarea id="mensagem" name="mensagem" rows="5" placeholder="Escreva sua mensagem"></textarea>

            <button type="submit" class="botao">Enviar mensagem</button>

        </form>

    </section>

</main>


</body>

</html>
